<title>Expedientes de Cthulhu</title>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: expediente de detective de una columna, pestañas fijas arriba, barra de guardado abajo */
@import url("https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap");
:root{
  --bg:#e6eae3; --paper:#f6f7f2; --ink:#1b2a2d; --muted:#5b6b67; --rule:#c8d0c5; --soft:#dde3da;
  --accent:#1f5d63; --accent-ink:#f2f7f5; --blood:#9a2f28; --mind:#5b4a86; --luck:#8a6a14; --ok:#2f6b3a;
  --f-display:"Special Elite","Courier New",Courier,monospace;
  --f-body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --paper:#172024; --ink:#dfe7e1; --muted:#8fa19c; --rule:#2c393c; --soft:#1f2a2e;
  --accent:#6fb5b1; --accent-ink:#0f1517; --blood:#e3826f; --mind:#b0a0dc; --luck:#d8b452; --ok:#7cc48a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1517; --paper:#172024; --ink:#dfe7e1; --muted:#8fa19c; --rule:#2c393c; --soft:#1f2a2e;
  --accent:#6fb5b1; --accent-ink:#0f1517; --blood:#e3826f; --mind:#b0a0dc; --luck:#d8b452; --ok:#7cc48a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
#root{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{font-family:var(--f-mono);-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* cabecera */
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1;margin:0;letter-spacing:.02em}
.head .sub{color:var(--muted);margin-top:6px}
.stamp{font-family:var(--f-display);border:2px solid var(--blood);color:var(--blood);padding:2px 8px;transform:rotate(-3deg);font-size:13px;letter-spacing:.1em;align-self:center}

/* pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;margin-bottom:6px;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

section{margin-top:18px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted)}

/* constantes vitales */
.vitals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vital{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c)}
.vital .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.vital .big{display:flex;align-items:baseline;gap:4px}
.vital .big input{width:3.4em;font-size:28px;font-weight:600;padding:0 4px;border-color:transparent;background:transparent;color:var(--c)}
.vital .big input:focus{border-color:var(--rule)}
.vital .max{color:var(--muted);font-family:var(--f-mono)}
.vital .max input{width:3em;padding:2px 4px;font-size:13px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .2s}
.step{display:flex;gap:4px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.hint{font-size:12px;color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:var(--paper);cursor:pointer;font-size:13px}
.flag input{width:auto;accent-color:var(--blood)}
.flag:has(input:checked){border-color:var(--blood);color:var(--blood);font-weight:600}

/* características */
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.char{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.char button.k{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:700;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.char button.k:hover{color:var(--accent)}
.char input{font-size:22px;font-weight:600;padding:2px 4px}
.hf{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:8px}
.extra{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}

/* info */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}

/* habilidades */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input{flex:1 1 160px}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.skills{background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.sk{display:grid;grid-template-columns:28px minmax(0,1fr) 64px 70px 28px;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--soft)}
.sk:first-child{border-top:0}
.sk input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.sk .nm{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.sk .nm b{font-weight:500}
.sk .nm span{color:var(--muted);font-size:12px;margin-left:4px}
.sk.tr .nm b{font-weight:700}
.sk input.v{text-align:center;padding:4px}
.sk .hf{justify-content:flex-end}
.sk .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:8px;margin-top:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

/* armas */
.weapon{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.weapon .top{display:flex;gap:8px;align-items:center}
.weapon .top input{font-weight:600;font-size:16px}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tri{display:flex;gap:6px}
.tri div{flex:1;text-align:center;background:var(--bg);border-radius:6px;padding:4px}
.tri b{display:block;font-family:var(--f-mono);font-size:18px}
.tri span{font-size:11px;color:var(--muted)}
.ammo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.pip.on{background:var(--ink)}

/* compañeros */
.mate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;gap:8px;margin-bottom:8px}

/* barra guardar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.savebar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.savebar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.savebar.saved{background:var(--paper);color:var(--muted);border-top:1px solid var(--rule)}

/* panel de tirada */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,15,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--paper);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-display);font-weight:400;margin:0;font-size:22px}
.targets{display:flex;gap:6px}
.targets div{flex:1;text-align:center;border:1px solid var(--rule);border-radius:8px;padding:6px}
.targets b{display:block;font-family:var(--f-mono);font-size:20px}
.targets span{font-size:11px;color:var(--muted)}
.mods{display:flex;gap:4px;flex-wrap:wrap}
.mods button{flex:1;min-width:52px;border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:13px}
.mods button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result{text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.result .n{font-family:var(--f-mono);font-size:46px;font-weight:600;line-height:1}
.result .d{font-family:var(--f-display);font-size:20px}
.result .dice{font-size:12px;color:var(--muted)}
.g-crit,.g-ext{color:var(--ok)} .g-dif,.g-norm{color:var(--accent)} .g-fail{color:var(--muted)} .g-fum{color:var(--blood)}
@media (max-width:520px){
  .chars,.extra{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .char{padding:6px}
  .char input{font-size:18px}
  .hf{gap:4px;font-size:11px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .sk{grid-template-columns:24px minmax(0,1fr) 54px 58px 22px;gap:6px;padding:7px 8px}
  .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

select{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px;width:100%;min-width:0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.back{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--accent);font-weight:600}
.status{font-size:12px;color:var(--muted);transition:color .2s}
.status.ok{color:var(--ok)} .status.warn{color:var(--blood);font-weight:600}
.who-list{display:flex;flex-direction:column;gap:8px}
.who{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;cursor:pointer}
.who b{font-family:var(--f-display);font-weight:400;font-size:20px}
.who span{grid-column:1;color:var(--muted);font-size:13px}
.who em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:12px;color:var(--muted)}
.intro p{max-width:60ch;margin:0}
.empty{padding:16px;color:var(--muted);font-size:14px}
.derive{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn.danger{background:transparent;color:var(--blood);border-color:var(--blood)}
.filebtn{display:inline-flex;align-items:center}
.presets{display:flex;flex-direction:column;gap:6px}
.preset{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.preset>div{display:flex;flex-direction:column;min-width:0}
.preset b{font-family:var(--f-display);font-weight:400;font-size:18px}
.preset span{color:var(--muted);font-size:13px}
</style>

  /* ---------- cálculo de derivados (reglas de 7ª edición) ---------- */
  function derive(){
    var c = S.car, F=+c.FUE||0, CO=+c.CON||0, T=+c.TAM||0, D=+c.DES||0, P=+c.POD||0, age=+S.info.edad||0;
    var pv = Math.floor((CO+T)/10), pm = Math.floor(P/5);
    S.pv.max = pv; S.pv.cur = pv; S.pm.max = pm; S.pm.cur = pm;
    S.cor.ini = P; S.cor.cur = P;
    var mov = (D<T && F<T) ? 7 : (D>T && F>T) ? 9 : 8;
    if (age>=40) mov -= Math.min(5, Math.floor((age-30)/10));
    S.mov = mov;
    var sum = F+T, bd, corp;
    if (sum<=64){ bd='-2'; corp='-2'; } else if (sum<=84){ bd='-1'; corp='-1'; } else if (sum<=124){ bd='0'; corp='0'; }
    else if (sum<=164){ bd='+1D4'; corp='1'; } else if (sum<=204){ bd='+1D6'; corp='2'; }
    else { var extra = Math.ceil((sum-204)/80); bd='+'+(1+extra)+'D6'; corp=String(2+extra); }
    S.bd = bd; S.corp = corp;
    var mitos = skillByName('Mitos de Cthulhu'); S.cor.max = 99 - (mitos ? valOf(mitos) : 0);
  }

  var rollCtx = null;
  function d10(){ return Math.floor(Math.random()*10); }
  function rollD100(mod){
    var u = d10(), n = 1+Math.abs(mod), tens = [], vals = [];
    for (var i=0;i<n;i++){ var t=d10(); tens.push(t); var v=t*10+u; if (v===0) v=100; vals.push(v); }
    var pick = mod>0 ? Math.min.apply(null,vals) : mod<0 ? Math.max.apply(null,vals) : vals[0];
    return {v:pick, tens:tens, u:u};
  }
  function degree(v,T){

    if (v<=h2(T)) return ['Éxito difícil','g-dif'];
    if (v<=T) return ['Éxito normal','g-norm'];
    return ['Fracaso','g-fail'];
  }

    host.innerHTML = '<div class="sheet" data-close-bg><div class="card" role="dialog" aria-label="Tirada">'+

  }
  function rollDamage(expr){
    var e = String(expr||'').toUpperCase().replace(/\s/g,'').replace(/BD/g, String(S.bd||'0').replace(/\s/g,'').toUpperCase());
    var total=0, parts=[], ok=false;
    e.replace(/([+-]?)([^+-]+)/g, function(_,sg,term){
      var sign = sg==='-'?-1:1, m = term.match(/^(\d*)D(\d+)$/);
      if (m){ var n=+(m[1]||1), f=+m[2], rs=[]; for (var i=0;i<n;i++){ var x=1+Math.floor(Math.random()*f); rs.push(x); total+=sign*x; } parts.push((sign<0?'−':'')+term+' ['+rs.join(', ')+']'); ok=true; }
      else if (/^\d+$/.test(term)){ total+=sign*(+term); if (+term) parts.push((sign<0?'−':'+')+term); ok=true; }
      return '';
    });
    return ok ? {free:true,total:Math.max(0,total),detail:parts.join(' ')} : {free:true,total:'?',detail:'No entiendo "'+expr+'". Usa algo como 1D10 o 1D3+BD.'};
  }

  /* ---------- importar ---------- */
  function importData(txt){
    var msg = document.getElementById('import-msg');
    try {
      var o = JSON.parse(String(txt).trim());
      var st = o && o.state ? o.state : o;
      if (!st || !st.info || !st.car || !Array.isArray(st.skills)) throw new Error('formato');
      var b = blank();
      Object.keys(b).forEach(function(k){ if (st[k]===undefined) st[k]=b[k]; });
      var id = uid(); DB.list.push({id:id, state:st}); pick(id); saveDB();
      ui.view='sheet'; ui.tab='ficha'; render(); window.scrollTo(0,0);
    } catch(e){ if (msg) msg.textContent = 'Ese código no es una ficha válida. Copia el código completo desde la pestaña Copia.'; }
  }

  /* ---------- eventos ---------- */
  root.addEventListener('input', function(e){
    var t = e.target;
    if (t.dataset.ui==='q'){ ui.q = t.value; var pos=t.selectionStart; render(); var q=document.getElementById('f-q'); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} return; }
    var p = t.dataset.path; if (!p || !S) return;
    var v;
    if (t.type==='checkbox') v = t.checked;
    else if (t.type==='number') v = t.value==='' ? (p.indexOf('skills.')===0?null:'') : +t.value;
    else v = t.value;
    setPath(p, v); liveUpdate(p, t); changed();
  });
  root.addEventListener('change', function(e){
    var t = e.target;
    if (t.tagName==='SELECT' && t.dataset.path){ setPath(t.dataset.path, t.value); changed(); render(); }
    if (t.id==='f-file' && t.files && t.files[0]){ var r = new FileReader(); r.onload=function(){ importData(r.result); }; r.readAsText(t.files[0]); }
  });
  function liveUpdate(p, t){
    if (p.indexOf('car.')===0){ var hf=document.querySelector('[data-hf="'+p+'"]'), k=p.slice(4); if (hf) hf.innerHTML='<span>½ '+h2(S.car[k])+'</span><span>⅕ '+h5(S.car[k])+'</span>'; }
    if (p.indexOf('skills.')===0 && /\.v$/.test(p)){ var i=+p.split('.')[1], el=document.querySelector('[data-hf-skill="'+i+'"]'), v=valOf(S.skills[i]); if (el) el.innerHTML='<span>'+h2(v)+'</span><span>'+h5(v)+'</span>'; }
    if (/^(pv|cor|suerte|pm)\./.test(p)){
      var key=p.split('.')[0], card=t.closest('.vital');
      if (card){ var mx = key==='suerte'?99:(+getPath(key+'.max')||1), cur=+getPath(key+'.cur')||0;
        card.querySelector('.bar i').style.width=Math.max(0,Math.min(100,cur/mx*100))+'%';
        var hn=card.querySelector('[data-hint]'); if (hn) hn.textContent=hints()[key]; }
    }
    if (p==='info.nombre'){ var h1=document.querySelector('.head h1'); if(h1) h1.textContent=S.info.nombre||'Sin nombre'; }
  }

  root.addEventListener('click', function(e){
    var b = e.target.closest('button,[data-close-bg]'); if (!b) return;
    var D = b.dataset;
    if (D.closeBg!==undefined && e.target!==b) return;
    if (D.new!==undefined){ var id=uid(); DB.list.push({id:id,state:blank()}); pick(id); saveDB(); ui.view='sheet'; ui.tab='ficha'; render(); window.scrollTo(0,0); return; }
    if (D.preset){
      var pr = PRESETS.filter(function(p){ return p.id===D.preset; })[0]; if (!pr) return;
      var nid = uid(), st = JSON.parse(JSON.stringify(pr.state)), bk = blank();
      Object.keys(bk).forEach(function(k){ if (st[k]===undefined) st[k]=bk[k]; });
      DB.list.push({id:nid, preset:pr.id, state:st}); pick(nid); saveDB(); ui.view='sheet'; ui.tab='ficha'; render(); window.scrollTo(0,0); return;
    }
    if (D.open){ pick(D.open); saveDB(); ui.view='sheet'; render(); window.scrollTo(0,0); return; }
    if (D.home!==undefined){ saveDB(); ui.view='home'; render(); window.scrollTo(0,0); return; }
    if (D.importText!==undefined){ importData(document.getElementById('f-import').value); return; }
    if (D.tab){ ui.tab=D.tab; try{localStorage.setItem(TAB_KEY,ui.tab);}catch(_){} render(); window.scrollTo(0,0); return; }
    if (D.filtro){ ui.filtro=D.filtro; render(); return; }
    if (D.step){ var cur=+getPath(D.step)||0; setPath(D.step, Math.max(0,cur+(+D.d))); changed(); render(); return; }
    if (D.derive!==undefined){
      if (CH.some(function(k){ return S.car[k]===''||S.car[k]==null; })){ var m=document.getElementById('derive-msg'); if (m) m.textContent='Faltan características por rellenar.'; return; }
      derive(); changed(); render(); return;
    }
    if (D.rollChar){ openRoll(CHN[D.rollChar], +S.car[D.rollChar]||0); return; }
    if (D.rollSkillI!==undefined){ var sk=S.skills[+D.rollSkillI]; openRoll(sk.n, valOf(sk)); return; }
    if (D.rollSkill){ var s2=skillByName(D.rollSkill); if (s2) openRoll(s2.n, valOf(s2)); return; }
    if (D.rollLuck!==undefined){ openRoll('Suerte', +S.suerte.cur||0); return; }
    if (D.rollSan!==undefined){ openRoll('Cordura', +S.cor.cur||0, 'Las tiradas de cordura no se pueden forzar.'); return; }
    if (D.rollArma!==undefined){ var w=S.armas[+D.rollArma], ws=skillByName(w.s); openRoll(w.n+' · '+w.s, ws?valOf(ws):0, 'Las tiradas de combate no se pueden forzar.'); return; }
    if (D.dmgArma!==undefined){ var wa=S.armas[+D.dmgArma]; rollCtx={title:'Daño · '+wa.n, T:null, mod:0, note:wa.dmg, res:rollDamage(wa.dmg), dmg:wa.dmg}; drawRoll(); return; }
    if (D.shot!==undefined){ var a=S.armas[+D.shot]; if ((+a.carga||0)>0){ a.carga=(+a.carga)-1; changed(); render(); } return; }
    if (D.reload!==undefined){ var a2=S.armas[+D.reload]; a2.carga=+a2.mun||0; changed(); render(); return; }
    if (D.addArma!==undefined){ S.armas.push({n:'Nueva arma',s:'Armas de fuego (Arma corta)',dmg:'',alc:'',at:'1',mun:'',av:'',carga:0}); changed(); render(); return; }
    if (D.delArma!==undefined){ if (b.dataset.confirm){ S.armas.splice(+D.delArma,1); changed(); render(); } else { b.dataset.confirm='1'; b.textContent='¿Quitar?'; } return; }
    if (D.addMate!==undefined){ S.companeros.push({p:'',j:''}); changed(); render(); return; }
    if (D.delMate!==undefined){ S.companeros.splice(+D.delMate,1); changed(); render(); return; }
    if (D.addSkill!==undefined){
      var nm=document.getElementById('f-new-skill').value.trim(), bs=document.getElementById('f-new-base').value;
      if (!nm){ document.getElementById('f-new-skill').focus(); return; }
      S.skills.push({n:nm,b:bs===''?1:+bs,custom:true}); S.skills.sort(function(x,y){return x.n.localeCompare(y.n,'es');});
      ui.filtro='todas'; ui.q=''; changed(); render(); return;
    }
    if (D.delSkill!==undefined){ if (b.dataset.confirm){ S.skills.splice(+D.delSkill,1); changed(); render(); } else { b.dataset.confirm='1'; b.textContent='?'; } return; }
    if (D.copyCode!==undefined){
      var tx=document.getElementById('f-code'), msg=document.getElementById('copy-msg');
      var done=function(){ msg.textContent='Código copiado. Guárdalo en una nota o mándatelo por WhatsApp.'; };
      var fallback=function(){ tx.focus(); tx.select(); msg.textContent='Texto seleccionado: cópialo con el menú del móvil.'; };
      try { navigator.clipboard.writeText(tx.value).then(done, fallback); } catch(_){ fallback(); }
      return;
    }
    if (D.exportFile!==undefined && STANDALONE){
      var nms=(S.info.nombre||'investigador').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'-').toLowerCase();
      var blob=new Blob([JSON.stringify({app:'ficha-cthulhu',v:1,state:S},null,1)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ficha-'+nms+'.json'; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      document.getElementById('copy-msg').textContent='Archivo descargado. Guárdalo donde no se pierda.';
      return;
    }
    if (D.exportFile!==undefined && downloads){
      var nmf=(S.info.nombre||'investigador').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'-').toLowerCase();
      var m2=document.getElementById('copy-msg');
      downloads.save({filename:'ficha-'+nmf+'.json', data:JSON.stringify({app:'ficha-cthulhu',v:1,state:S},null,1)}).then(function(r){ if (r && r.status==='saved') m2.textContent='Archivo descargado.'; }, function(err){ if (err && err.code==='unavailable'){ downloads=null; render(); } else m2.textContent='No se descargó. Usa Copiar código.'; });
      return;
    }
    if (D.deleteChar!==undefined){
      if (b.dataset.confirm){ DB.list=DB.list.filter(function(x){return x.id!==DB.current;}); pick(null); saveDB(); ui.view='home'; render(); window.scrollTo(0,0); }
      else { b.dataset.confirm='1'; b.textContent='Pulsa otra vez para borrar'; }
      return;
    }
    if (D.mod!==undefined){ rollCtx.mod=+D.mod; rollCtx.res=null; drawRoll(); return; }
    if (D.doRoll!==undefined){ rollCtx.res = rollCtx.dmg ? rollDamage(rollCtx.dmg) : rollD100(rollCtx.mod); drawRoll(); return; }
    if (D.close!==undefined || D.closeBg!==undefined){ rollCtx=null; drawRoll(); return; }
  });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && rollCtx){ rollCtx=null; drawRoll(); } });
  window.addEventListener('pagehide', function(){ clearTimeout(saveTimer); if (S) saveDB(); });

  render();
  if (window.claude && window.claude.use){
    window.claude.use('downloads').then(function(d){ downloads=d; if (d && ui.tab==='copia' && ui.view==='sheet') render(); }, function(){});
  }
})();
</script>

try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}</script>
